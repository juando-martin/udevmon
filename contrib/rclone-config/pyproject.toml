[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "udevmon-rclone-config"
version = "0.1.0"
description = "udevmon helper: publish a drive's rclone config while the drive is present"
requires-python = ">=3.10"
dependencies = []                  # standard library only

[project.scripts]
rclone-config = "rclone_config:entry"

[tool.setuptools]
py-modules = ["rclone_config"]
