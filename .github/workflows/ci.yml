name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the version comes from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries (PyGObject builds from source)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository-2.0-dev libcairo2-dev pkg-config
      - name: Install
        run: python -m pip install -e '.[docs]'
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Documentation
        run: python tools/docs.py build
