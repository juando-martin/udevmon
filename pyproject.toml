[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "udevmon"
dynamic = ["version"]              # from git, see setup.py
description = "Run user-defined actions when USB devices or removable filesystems appear or disappear"
requires-python = ">=3.10"
dependencies = ["pyudev", "PyGObject", "tomlkit>=0.11.7,!=0.15.0",
                "tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
docs = ["sphinx>=8,<10"]           # the HTML manual: tools/docs.py (DEVELOPMENT.md)

[project.scripts]
udevmon = "udevmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
